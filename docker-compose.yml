services:
  web:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: doc-generator
    ports:
      - "8085:80"
    volumes:
      - ./:/var/www/html
    environment:
      - PHP_DISPLAY_ERRORS=1
      - PHP_ERROR_REPORTING=E_ALL
    networks:
      - doc-network

networks:
  doc-network:
    driver: bridge
